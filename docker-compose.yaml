services:
  db:
    image: postgres:18.3
    container_name: postgres-db
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: social_simple
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  
volumes:
  db-data: 

